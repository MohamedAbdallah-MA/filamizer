<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-variant="canvas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Filamizer · Preview Workspace</title>
<style>
:root {
  --stage:#ecedf3; --bg:#f8f9fc; --surface:#fff; --soft:#f0f2f8; --ink:#191e31; --muted:#5b647b; --line:#dfe3ee;
  --accent:#4f46c6; --accent-soft:#edeaff; --on-accent:#fff; --ok:#126849; --ok-soft:#e1f5eb; --warn:#875410; --warn-soft:#fff1d7;
  --danger:#a53343; --danger-soft:#fce9ed; --to-bg:#222636; --to-ink:#f7f8ff; --to-link:#c5c0ff; --bezel:#191b27;
  --shadow:0 18px 52px -28px #18204265; --pop:0 24px 56px #1418273d; --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Segoe UI",Tahoma,system-ui,sans-serif; --radius:14px; --scrim:#14182770;
  font:15px/1.5 var(--font); color:var(--ink); font-variant-numeric:tabular-nums;
}
[data-variant=hub]{--stage:#eaece6;--bg:#f6f7f2;--surface:#fff;--soft:#eef1ea;--ink:#192821;--muted:#536458;--line:#dce4da;--accent:#23634d;--accent-soft:#e3f1e9;--to-link:#9ce5c4}
[data-variant=canvas]{--stage:#e7edf5;--bg:#f7f9fd;--surface:#fff;--soft:#edf2f9;--ink:#192842;--muted:#536681;--line:#d9e2ef;--accent:#205baf;--accent-soft:#e6efff;--to-link:#b3d2ff}
[data-theme=dark]{--stage:#0d1020;--bg:#151928;--surface:#1c2235;--soft:#252d43;--ink:#f1f3fe;--muted:#b1b9d2;--line:#36415b;--accent:#b0a7ff;--accent-soft:#332c59;--on-accent:#1c143c;--ok:#9de6ba;--ok-soft:#203d33;--warn:#ffd394;--warn-soft:#453921;--danger:#ffb2c1;--danger-soft:#492a39;--bezel:#2c334a;--shadow:0 20px 55px -24px #000a;--pop:0 24px 64px #0008}
[data-theme=dark][data-variant=hub]{--stage:#0e1815;--bg:#15221e;--surface:#1c2c26;--soft:#23382e;--ink:#edf8f1;--muted:#b3c8bd;--line:#354a3f;--accent:#a2e6c6;--accent-soft:#24483a;--on-accent:#112e22}
[data-theme=dark][data-variant=canvas]{--stage:#0f1725;--bg:#151f30;--surface:#1c293e;--soft:#25354f;--ink:#edf4ff;--muted:#b0c1db;--line:#374a65;--accent:#a4c9ff;--accent-soft:#293f62;--on-accent:#152f50}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.43}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0} h1{font-size:clamp(26px,4cqw,36px);line-height:1.22;font-weight:720} h2{font-size:20px;line-height:1.35} h3{font-size:15px}
[dir=ltr] h1{letter-spacing:-.045em} [dir=rtl] .flip{transform:scaleX(-1)}
svg.i{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.stage{display:grid;place-items:center;min-height:100dvh;padding:20px 20px 76px}
.device{position:relative;container-type:inline-size;width:min(1320px,100%);height:max(540px,calc(100dvh - 96px));overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:20px;background:var(--bg);box-shadow:var(--shadow)}
.device[data-device=mobile]{width:min(390px,100%);height:min(844px,calc(100dvh - 96px));min-height:500px;border-radius:36px;box-shadow:0 0 0 7px var(--bezel),var(--shadow)}
.app{height:100%;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.statusbar{display:none;justify-content:space-between;align-items:center;padding:10px 24px 1px;background:var(--surface);font-size:12px;font-weight:650}
[data-device=mobile] .statusbar{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:9px 24px;border-block-end:1px solid var(--line);background:var(--surface)}
.brand,.scope,.brand-mark,.page-kicker,.save-note{display:flex;align-items:center;gap:10px}
.brand{font-size:17px;font-weight:740}
.brand-mark{width:34px;height:34px;justify-content:center;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.scope{color:var(--muted);font-size:12px}.scope .i{width:16px;height:16px}
.main{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.shell{max-width:1120px;margin-inline:auto;padding:25px 28px 32px}
.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-block-end:20px}
.intro p,.section-head p,.muted{color:var(--muted)}
.intro p{margin-block-start:6px;font-size:14px}
.page-kicker{color:var(--accent);font-weight:650;font-size:12px;margin-block-end:5px}
.btn,.icon-btn,.seg button,.chip,.tab,.rail-link,.profile-row,.area,.swatch,.skin{transition:transform 150ms var(--ease),background 150ms var(--ease),border-color 150ms var(--ease)}
button:enabled:active{transform:scale(.975)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:7px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:650;white-space:nowrap}
.btn:hover:not(:disabled),.icon-btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--danger)} .btn.quiet{background:transparent}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;color:var(--muted);flex:none}
.icon-btn .i{width:17px;height:17px}.icon-btn.danger{color:var(--danger)}
.section{padding:17px 19px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.section-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-block-end:14px}
.section-head p{font-size:13px;margin-block-start:3px}
.editing{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tabs{display:flex;gap:18px;padding-inline:17px;border-block-end:1px solid var(--line);background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:2px 10px 0;border-block-end:2px solid transparent;color:var(--muted);font-weight:650;white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent);border-color:var(--accent)}.tab:hover{background:var(--soft)}
.content-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(275px,.82fr);align-items:start;gap:14px;padding:16px}
.controls{min-width:0;display:grid;gap:12px}.controls .section{box-shadow:none}
.control-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-block-end:12px}
.seg{display:inline-flex;gap:3px;background:var(--soft);border-radius:10px;padding:3px}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:35px;padding:5px 11px;border:1px solid transparent;border-radius:8px;font-size:13px;font-weight:650;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);border-color:var(--line);color:var(--accent)}
.seg .i{width:16px;height:16px}
.skin-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.skin{min-width:0;display:grid;justify-items:center;align-content:start;gap:6px;padding:7px 3px 5px;min-height:63px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:11px;line-height:1.3}
.skin[aria-pressed=true],.swatch[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.skin-icon{width:min(39px,100%);height:23px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:grid;grid-template-columns:27% 1fr;gap:3px;padding:3px}
.skin-icon i{border-radius:2px;background:var(--accent-soft);border-block-start:2px solid var(--accent)}
.skin[data-value=glass] .skin-icon{background:var(--accent-soft);border-radius:6px}
.skin[data-value=neon] .skin-icon{background:var(--to-bg)}
.skin[data-value=soft] .skin-icon{border-radius:9px}
.skin[data-value=minimal] .skin-icon i{background:transparent}
.field{display:grid;gap:6px;min-width:0;font-size:13px;font-weight:650}
.field select,.field input:not([type=range]){min-height:42px;width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:7px 10px}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center}.swatch i{width:19px;height:19px;border-radius:50%;background:var(--color)}
.tone-sample{font:12px/1.3 Consolas,monospace;color:var(--muted)}
.preview{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--soft);overflow:hidden;position:sticky;inset-block-start:0}
.preview-header,.preview-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 13px;background:var(--surface);font-size:12px;font-weight:650}
.preview-header{border-block-end:1px solid var(--line)}.preview-foot{border-block-start:1px solid var(--line);color:var(--muted)}
.preview-header span,.preview-foot span{display:flex;align-items:center;gap:6px}
.preview-header .i,.preview-foot .i{width:15px;height:15px}
.preview-chrome{padding:13px}
.mini{--m-bg:#f4f5fb;--m-surface:#fff;--m-line:#dce1ee;--m-ink:#242c48;--m-muted:#5b6681;--m-radius:9px;--m-space:12px;padding:var(--m-space);background:var(--m-bg);border:1px solid var(--m-line);border-radius:var(--m-radius);color:var(--m-ink);overflow:hidden;font-size:12px}
.mini[data-mode=dark]{--m-bg:#141a30;--m-surface:#232c46;--m-line:#37425e;--m-ink:#f2f4ff;--m-muted:#bac4e4}
.mini[data-skin=glass]{--m-surface:color-mix(in srgb,var(--m-ink) 7%,var(--m-bg));--m-line:color-mix(in srgb,var(--user) 28%,var(--m-bg))}
.mini[data-skin=neon]{--m-line:color-mix(in srgb,var(--user) 58%,var(--m-bg))}
.mini[data-skin=soft]{--m-radius:17px}.mini[data-skin=minimal]{--m-radius:3px;--m-surface:var(--m-bg)}
.mini[data-backdrop=mesh]{background:radial-gradient(ellipse at 95% 9%,color-mix(in srgb,var(--user) 27%,transparent),transparent 70%),var(--m-bg)}
.mini[data-backdrop=gradient]{background:linear-gradient(145deg,var(--m-bg) 55%,color-mix(in srgb,var(--user) 25%,var(--m-bg)))}
.mini[data-density=compact]{--m-space:7px}.mini[data-density=spacious]{--m-space:17px}
.mini-bar{display:flex;align-items:center;justify-content:space-between;margin-block-end:var(--m-space);font-weight:700}
.mini-bar .i{width:14px;height:14px;color:color-mix(in srgb,var(--user) 74%,var(--m-ink))}
.mini-body{display:grid;grid-template-columns:minmax(70px,31%) minmax(0,1fr);gap:7px}
.mini-menu,.mini-card,.mini-chart{min-width:0;border:1px solid var(--m-line);border-radius:var(--m-radius);background:var(--m-surface)}
.mini-menu{padding:6px;overflow:hidden}.mini-menu div{padding:4px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:10.5px}
.mini-menu div:first-child,.mini-menu .mini-group{color:var(--m-ink);background:color-mix(in srgb,var(--user) 15%,var(--m-surface));border-radius:4px;font-weight:650}
.mini-menu .mini-group{margin-block-start:6px;background:none}
.mini-work{display:grid;align-content:start;gap:6px;min-width:0}.mini-metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mini-card{padding:6px;color:var(--m-muted);font-size:10px}.mini-card strong{display:block;color:var(--m-ink);font-size:17px}
.mini-chart{height:86px;padding:7px;display:grid;grid-template-rows:auto 1fr;gap:3px;font-size:10px}
.bars{display:flex;align-items:end;gap:3px;height:100%}.bars i{flex:1;height:var(--height);border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--user) 66%,var(--m-bg))}
.sidebar-content{padding:16px}.sidebar-content .section{max-width:100%}
.search{display:flex;align-items:center;gap:7px;min-height:43px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted)}
.search:focus-within{border-color:var(--accent)}.search input{flex:1;min-width:0;border:0;outline:0;background:none}.search .i{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-block:10px}
.chip{min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px}
.chip[aria-pressed=true]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.chip small{font-size:11px;color:inherit}
.list{display:grid;gap:6px}.group-title{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-block:8px 2px;color:var(--muted);font-size:12px;font-weight:650}
.row,.profile-row{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px 7px;min-height:47px}
.row.hidden-item{background:var(--bg)}.row.flash,.profile-row.flash{animation:flash 1.4s var(--ease)}
.row-open,.profile-row{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:start;min-height:43px}
.row-open:hover,.profile-row:hover{color:var(--accent)}.item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}
.row-open .i{color:var(--accent);width:16px;height:16px}.row-actions{display:flex;align-items:center}.row-actions button{width:31px;height:36px}
.badge{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-block-start:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);background:var(--bg)}
#savebar{position:sticky;inset-block-end:0;z-index:2}
.save-note{color:var(--muted);font-size:12px}.save-note[data-dirty=true]{color:var(--warn)}
.savebar .actions{display:flex;gap:6px;flex-wrap:wrap}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area{min-width:0;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:9px;box-shadow:var(--shadow)}
.area:hover{border-color:var(--accent)}.area h2{font-size:23px}.area p{font-size:13px;color:var(--muted)}
.area-title{font-size:24px;line-height:1.25}
.area-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.area-cta{color:var(--accent);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650}
.area-visual{height:110px;border:1px solid var(--line);border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.area-visual .skin-icon{width:69px;height:45px;padding:6px;transform:rotate(-8deg);background:var(--surface);box-shadow:var(--shadow)}
.area-visual .skin-icon:nth-child(2){transform:translateY(-4px);height:52px;width:79px;border-color:var(--accent)}
.area-visual .skin-icon:nth-child(3){transform:rotate(8deg)}
.nav-art{width:67%;display:grid;gap:5px}.nav-art span{height:19px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:3px 8px}.nav-art span:nth-child(2){margin-inline-start:14px;border-color:var(--accent)}.nav-art i{height:4px;width:44%;background:var(--line);border-radius:5px}.nav-art .i{width:13px;height:13px;color:var(--accent)}
.hub-extra{margin-block-start:12px}
.back{margin-block-end:10px;color:var(--accent)}
.workspace{display:grid;grid-template-columns:162px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.rail{border-inline-end:1px solid var(--line);border-radius:inherit;padding:11px 9px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.rail-link{display:flex;gap:7px;align-items:center;text-align:start;min-height:43px;padding:7px 9px;border-radius:9px;font-size:13px;white-space:nowrap;color:var(--muted)}
.rail-link[aria-current=page]{color:var(--accent);background:var(--accent-soft);font-weight:700}.rail-link:hover{background:var(--soft)}
.work-pane{min-width:0}.work-title{padding:12px 16px;border-block-end:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:6px}.work-title h2{font-size:16px}
.workspace .content-grid{grid-template-columns:minmax(0,1fr) minmax(275px,1fr);gap:12px;padding:12px}
.workspace .preview{order:-1;align-self:start}.workspace .preview-chrome{padding:17px}
.workspace .controls>.section{padding:12px}
.work-focus .content-grid{grid-template-columns:1fr}.work-focus .controls{display:none}.work-focus .preview{width:min(100%,620px);margin-inline:auto}
.work-focus .mini-chart{height:155px}
.profile-space{display:grid;gap:8px}.profile-space .profile-row{padding:7px 9px}
.profile-fields{display:grid;gap:10px}.profile-fields .pairs{align-items:start}
.profile-samples{display:grid;gap:10px;margin-block-end:16px}.profile-samples .mini{max-height:240px}
.state{min-height:160px;display:grid;justify-items:center;align-content:center;gap:7px;text-align:center;padding:16px;color:var(--muted)}
.state .art{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.state h3{color:var(--ink)}.state p{font-size:13px}.state .btn{margin-block-start:4px}
.skel{padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:51px;border:1px solid var(--line);border-radius:9px}
.sk{display:block;border-radius:5px;height:10px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200%;animation:shimmer 1.3s linear infinite}
.dots{display:flex;gap:4px}.dots i{width:15px;height:15px;border-radius:50%;border:1px solid var(--line);background:var(--color)}
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease)}.scrim.on{opacity:1;pointer-events:auto}
.sheet,.modal{position:absolute;z-index:21;visibility:hidden;pointer-events:none}
.sheet.on,.modal.on{visibility:visible;pointer-events:auto}
.sheet{inset-block:0;inset-inline-end:0;width:min(424px,94%);overflow:auto;padding:21px;background:var(--surface);box-shadow:var(--pop)}
.sheet.on{animation:sheet-in 240ms var(--ease)}
.modal{inset:0;display:grid;place-items:center;padding:15px}.modal-card{width:min(100%,425px);max-height:100%;overflow:auto;padding:17px 19px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--pop)}
.modal.on .modal-card{animation:rise 210ms var(--ease)}.modal-card.shake{animation:shake 350ms}
.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:8px;margin-block-end:14px}
.dialog-head p{margin-block-start:5px;color:var(--muted);font-size:13px}
.dialog-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-block-start:15px}
.error{color:var(--danger);min-height:19px;font-size:12px;font-weight:550}
[aria-invalid=true]{border-color:var(--danger)!important}
.toasts{position:absolute;inset-inline:10px;inset-block-end:12px;z-index:30;pointer-events:none;display:grid;justify-items:center;gap:5px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:8px 11px;max-width:100%;border-radius:9px;background:var(--to-bg);color:var(--to-ink);box-shadow:var(--shadow);font-size:13px;animation:rise 180ms var(--ease)}
.toast button{color:var(--to-link);padding:5px;font-weight:700}
.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:5px;padding:5px;border-radius:13px;background:var(--to-bg);color:var(--to-ink);box-shadow:var(--shadow);font:600 11px/1 system-ui,sans-serif;max-width:calc(100% - 16px)}
.dock[hidden]{display:none}.dock button{padding:6px;min-height:32px;border-radius:7px;white-space:nowrap}.dock button[aria-pressed=true],.dock button:hover{background:var(--to-ink);color:var(--to-bg)}
.dock button .i{width:15px;height:15px}.dock .dock-group{display:flex;gap:1px}.dock .hint{padding-inline:4px;color:var(--to-link)}
[dir=ltr]{--dirx:1}[dir=rtl]{--dirx:-1}

@container (max-width:650px){

  .btn,.icon-btn,.seg button{min-height:44px}.swatch{width:44px;height:44px}.row-actions button{width:44px;height:44px}.chip{min-height:44px}

    theme:['theme','emptyTheme',btn('restore','restore','refresh','primary')],
    sidebar:['sidebar','emptyNav',btn('new-group','addGroup','plus','primary')],
    profiles:['profiles','emptyProfiles',btn('new-profile','newProfile','plus','primary')]
  }[S.page];
  return stateCard(options[0],'empty',options[1],options[2]);
}
function selectField(key, values, selected) {
  return '<label class="field">'+t(key)+'<select data-field="'+key+'">'+values.map(value=>'<option value="'+value+'" '+(value===selected?'selected':'')+'>'+t(value)+'</option>').join('')+'</select></label>';
}
function themeControls() {
  const look = S.working.look[S.mode];
  return '<section class="section"><div class="section-head"><div><h2>'+t('editor')+'</h2><p>'+t('themeHelp')+'</p></div></div>'+
    '<div class="control-line"><b>'+t('mode')+'</b><div class="seg" role="group" aria-label="'+t('mode')+'">'+
    ['light','dark'].map(key=>'<button data-mode="'+key+'"'+pressed(S.mode===key)+'>'+icon(key==='light'?'sun':'moon')+t(key)+'</button>').join('')+'</div></div>'+
    '<div class="field">'+t('skin')+'<div class="skin-grid" role="group" aria-label="'+t('skin')+'">'+
    skins.map(key=>'<button class="skin" data-look="skin" data-value="'+key+'"'+pressed(look.skin===key)+'>'+skinArt+t(key)+'</button>').join('')+
    '</div></div></section><section class="section"><div class="section-head"><h3>'+t('color')+'</h3><bdi class="tone-sample" dir="ltr">'+palette[look.color]+'</bdi></div>'+
    '<div class="swatches">'+Object.entries(palette).map(([key,hex])=>'<button class="swatch" title="'+t(key)+'" aria-label="'+t(key)+'" data-look="color" data-value="'+key+'"'+
    pressed(look.color===key)+'><i style="--color:'+hex+'"></i></button>').join('')+'</div></section>'+
    '<section class="section"><div class="pairs">'+selectField('backdrop',['solid','gradient','mesh'],look.backdrop)+
    selectField('density',['compact','comfortable','spacious'],S.working.density)+'</div><div style="margin-top:10px">'+
    btn('advanced','advanced','settings','quiet','aria-expanded="'+S.advanced+'"')+'</div>'+
    (S.advanced?'<label class="field" style="margin-top:10px">'+t('radius')+' · <output id="radius-value">'+number(look.radius)+'</output><input type="range" data-field="radius" min="3" max="22" value="'+look.radius+'"></label>':'')+'</section>';
}
function mini(configuration, mode) {
  const look=configuration.look[mode], settings=S.working;
  const shown = settings.nav.filter(item=>!item.hidden);
  const menu = [{id:'',ar:'',en:''},...settings.groups].map(group => {
    const items=shown.filter(item=>item.group===group.id);
    return items.length ? (group.id?'<div class="mini-group">'+label(group)+'</div>':'')+items.map(item=>'<div>'+label(item)+'</div>').join('') : '';
  }).join('');
  const radius=Math.max(3,Math.min(25,look.radius+({soft:6,minimal:-7,glass:2}[look.skin]||0)));
  return '<div class="mini" data-mode="'+mode+'" data-skin="'+look.skin+'" data-backdrop="'+look.backdrop+'" data-density="'+configuration.density+
    '" style="--user:'+palette[look.color]+';--m-radius:'+radius+'px"><div class="mini-bar"><span>'+t('dashboard')+'</span>'+icon('grid')+'</div>'+
    '<div class="mini-body"><div class="mini-menu">'+(menu||'<div>—</div>')+'</div><div class="mini-work"><div class="mini-metrics">'+
    '<div class="mini-card">'+t('sales')+'<strong>'+number(2840)+'</strong></div><div class="mini-card">'+t('pending')+'<strong>'+number(0)+'</strong></div>'+
    '</div><div class="mini-chart"><span>'+t('activity')+'</span><div class="bars" aria-hidden="true">'+[37,58,43,72,61,85,66,92].map(height=>'<i style="--height:'+height+'%"></i>').join('')+
    '</div></div></div></div></div>';
}
function preview() {
  return '<aside class="preview" id="preview"><div class="preview-header"><span>'+icon('monitor')+t('preview')+'</span><span class="badge">'+t(S.mode)+'</span></div>'+
    '<div class="preview-chrome">'+mini(S.working,S.mode)+'</div><div class="preview-foot"><span><i class="live-dot"></i>'+t('live')+'</span><span>'+t(S.working.look[S.mode].skin)+'</span></div></aside>';
}
function sidebarEditor() {
  return '<section class="section"><div class="section-head"><div><h2>'+t('builder')+'</h2><p>'+t('hideNote')+'</p></div>'+
    btn('new-group','addGroup','plus')+'</div>'+searchField('searchNav')+'<div id="results">'+navResults()+'</div></section>';
}
function searchField(key) {
  return '<label class="search">'+icon('search')+'<input id="search" type="search" placeholder="'+t(key)+'" aria-label="'+t(key)+
    '" value="'+esc(S.query)+'" autocomplete="off"></label>';
}
const matches = entry => !S.query.trim() || [entry.ar,entry.en].some(value=>value.toLowerCase().includes(S.query.trim().toLowerCase()));
function noResults() {
  return stateCard('search','noResults','',btn('clear','clear','close'),S.query.trim()?'«'+esc(S.query.trim())+'»':'');
}
function navResults() {
  const nav=S.working.nav;
  const counts = {all:nav.length,visible:nav.filter(item=>!item.hidden).length,hidden:nav.filter(item=>item.hidden).length};
  const list = nav.filter(item=>matches(item)&&(S.filter==='all'||item.hidden===(S.filter==='hidden')));
  const groups = [{id:'',ar:t('noGroup'),en:t('noGroup')},...S.working.groups];
  const sections = groups.map(group=>{
    const groupItems=list.filter(item=>item.group===group.id);
    if (!groupItems.length && (!group.id||S.query||S.filter!=='all')) return '';
    return '<div class="group-title"><span>'+label(group)+'</span>'+
      (group.id?iconBtn('delete-group','deleteGroup','trash','data-id="'+group.id+'"'):'')+'</div>'+
      groupItems.map(item=>{
        const siblings=nav.filter(other=>other.group===group.id);
        const index=siblings.indexOf(item), attr='data-id="'+item.id+'"';
        return '<div class="row '+(item.hidden?'hidden-item ':'')+(S.highlight===item.id?'flash':'')+'"><button class="row-open" data-act="open-item" '+attr+'>'+
          icon(item.icon)+'<span class="item-name" title="'+label(item)+'">'+label(item)+'</span></button>'+
          (item.hidden?'<span class="badge">'+t('hidden')+'</span>':'')+'<div class="row-actions">'+
          iconBtn('visibility',item.hidden?'show':'hide',item.hidden?'off':'eye',attr+' role="switch" aria-checked="'+!item.hidden+'"')+
          iconBtn('up','moveUp','up',attr+(index===0?' disabled':''))+iconBtn('down','moveDown','down',attr+(index===siblings.length-1?' disabled':''))+'</div></div>';
      }).join('');
  }).join('');
  return '<div class="chips" role="group" aria-label="'+t('sidebar')+'">'+Object.keys(counts).map(key=>'<button class="chip" data-filter="'+key+'"'+pressed(S.filter===key)+
    '>'+t(key)+' <small>'+number(counts[key])+'</small></button>').join('')+'</div>'+
    (sections?'<div class="list">'+sections+'</div>':noResults());
}
function profilesEditor() {
  return '<section class="section"><div class="section-head"><div><h2>'+t('profiles')+'</h2><p>'+t('profileHelp')+'</p></div>'+
    btn('new-profile','newProfile','plus')+'</div>'+searchField('searchProfiles')+'<div id="results" style="margin-top:9px">'+profileResults()+'</div></section>';
}
function profileResults() {
  const results=S.profiles.filter(matches);
  if (!S.profiles.length) return emptyState();
  if (!results.length) return noResults();
  return '<div class="profile-space">'+results.map(profile=>'<button class="profile-row '+(S.highlight===profile.id?'flash':'')+'" data-act="open-profile" data-id="'+profile.id+'">'+
    icon('profiles')+'<span class="item-name">'+label(profile)+'</span><span class="dots" aria-hidden="true" style="margin-inline-start:auto">'+
    ['light','dark'].map(mode=>'<i style="--color:'+palette[profile.look[mode].color]+'"></i>').join('')+'</span><span class="badge">'+t('shared')+
    '</span>'+icon('arrow','flip')+'</button>').join('')+'</div>';
}
function paintResults() {
  const result=$('#results');
  if(result) result.innerHTML=S.page==='sidebar'?navResults():profileResults();
}
function setPage(page) {
  S.page=page;
  S.query=''; S.filter='all'; S.focus=false;
  renderShell(true);
}
function setView(view, retry = false) {
  clearTimeout(S.timer);
  closeOverlay(false);
  S.view=view;
  renderShell();
  if(retry) S.timer=setTimeout(()=>setView('ready'),650);
}
function updateWorking(message, edit) {
  const previous=clone(S.working);
  edit(S.working);
  renderShell();
  toast(t(message),()=>{
    S.working=previous;
    renderShell();
  });
}
function moveNav(id, direction) {
  const nav=S.working.nav;
  const item=nav.find(entry=>entry.id===id);
  const siblings=nav.filter(entry=>entry.group===item.group);
  const other=siblings[siblings.indexOf(item)+direction];
  if (!other) return;
  updateWorking('moved',work=>{
    const from=work.nav.findIndex(entry=>entry.id===id), to=work.nav.findIndex(entry=>entry.id===other.id);
    [work.nav[from],work.nav[to]]=[work.nav[to],work.nav[from]];
  });
}
function toast(message, undo) {
  const host=$('#toasts');
  const id=++S.toastID;
  const entry=document.createElement('div');
  entry.className='toast';
  entry.dataset.toastId=id;
  entry.innerHTML=icon('check')+'<span>'+esc(message)+'</span>'+(undo?'<button data-act="undo" data-id="'+id+'">'+t('undo')+'</button>':'');
  while(host.children.length>=3) removeToast(Number(host.firstElementChild.dataset.toastId));
  host.append(entry);
  S.toasts.set(id,{entry,undo,timer:setTimeout(()=>removeToast(id),undo?7000:2800)});
}
function removeToast(id) {
  const record=S.toasts.get(id);
  if(!record) return;
  clearTimeout(record.timer);
  record.entry.remove();
  S.toasts.delete(id);
}
function openOverlay(kind,id=null) {
  S.returnFocus=document.activeElement;
  S.overlay={kind,id,tried:false};
  renderOverlay();
  $('#app').inert=true;
  $('#scrim').classList.add('on');
  const el=overlayEl();
  el.inert=false;
  el.classList.add('on');
  (el.querySelector('input')||el.querySelector('button')||el).focus({preventScroll:true});
}
function overlayEl() { return $('#'+(['item','profile'].includes(S.overlay.kind)?'sheet':'modal')); }
function closeOverlay(restore=true) {
  if(!S.overlay) return;
  const el=overlayEl();
  el.classList.remove('on');
  el.inert=true;
  el.innerHTML='';
  $('#app').inert=false;
  $('#scrim').classList.remove('on');
  S.overlay=null;
  if(restore && S.returnFocus?.isConnected) S.returnFocus.focus({preventScroll:true});
}
function dialogHead(text,subtitle='') {
  return '<header class="dialog-head"><div><h2 id="dialog-title">'+text+'</h2>'+(subtitle?'<p>'+subtitle+'</p>':'')+'</div>'+iconBtn('close','close','close')+'</header>';
}
function nameField(caption,name,value='') {
  return '<label class="field">'+t(caption)+'<input name="'+name+'" maxlength="48" dir="auto" autocomplete="off" value="'+esc(value)+'" aria-describedby="err-'+name+'"><span id="err-'+name+'" class="error"></span></label>';
}
function formActions(submit) {
  return '<div class="dialog-actions">'+btn('close','cancel')+'<button class="btn primary" type="submit">'+t(submit)+'</button></div>';
}
function renderOverlay() {
  const {kind,id}=S.overlay;
  const el=overlayEl();
  if(kind==='item') {
    const item=S.working.nav.find(entry=>entry.id===id);
    el.innerHTML=dialogHead(label(item),t('item'))+'<form class="profile-fields" novalidate>'+
      nameField('name','ar',item.ar)+nameField('englishName','en',item.en)+'<label class="field">'+t('group')+'<select name="group"><option value="">'+t('noGroup')+
      '</option>'+S.working.groups.map(group=>'<option value="'+group.id+'" '+(group.id===item.group?'selected':'')+'>'+label(group)+'</option>').join('')+
      '</select></label>'+formActions('save')+'</form>';
  } else if(kind==='profile') {
    const profile=S.profiles.find(entry=>entry.id===id);
    el.innerHTML=dialogHead(label(profile),t('profileHelp'))+'<div class="profile-samples">'+['light','dark'].map(mode=>'<div><h3>'+t(mode)+
      '</h3>'+mini(profile,mode)+'</div>').join('')+'</div><div class="dialog-actions">'+
      btn('delete-profile','delete','trash','danger','data-id="'+id+'"')+btn('apply-profile','load','check','primary','data-id="'+id+'"')+'</div>';
  } else {
    const group=kind==='group';
    el.innerHTML='<form class="modal-card" novalidate>'+dialogHead(t(group?'addGroup':'newProfile'))+
      nameField(group?'groupName':'profileName','name')+formActions(group?'addGroup':'create')+'</form>';
  }
}
function validate(form) {
  const fields=[...form.querySelectorAll('input')];
  for(const input of fields) {
    const value=input.value.trim();
    let message=value.length<2?t('valid'):'';
    if(!message && S.overlay.kind!=='item') {
      const list=S.overlay.kind==='group'?S.working.groups:S.profiles;
      if(list.some(entry=>[entry.ar,entry.en].some(name=>name.toLowerCase()===value.toLowerCase()))) message=t('duplicate');
    }
    input.setAttribute('aria-invalid',!!message);
    $('#err-'+input.name,form).textContent=message;
  }
  return fields.find(input=>input.getAttribute('aria-invalid')==='true');
}
function handleSubmit(form) {
  const {kind,id}=S.overlay;
  S.overlay.tried=true;
  const invalid=validate(form);
  if(invalid) {
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    invalid.focus();
    return;
  }
  const data=new FormData(form);
  closeOverlay();
  if(kind==='item') {
    S.highlight=id;
    updateWorking('changed',work=>{
      const item=work.nav.find(entry=>entry.id===id);
      Object.assign(item,{ar:data.get('ar').trim(),en:data.get('en').trim(),group:data.get('group')});
    });
  } else if(kind==='group') {
    const name=data.get('name').trim(), key='g'+S.next++;
    S.view='ready'; S.query=''; S.filter='all';
    updateWorking('groupAdded',work=>work.groups.unshift({id:key,ar:name,en:name}));
  } else {
    const name=data.get('name').trim(), key=S.next++;
    S.profiles.unshift({id:key,ar:name,en:name,look:clone(S.working.look),density:S.working.density});
    S.highlight=key; S.view='ready';
    setPage('profiles');
    toast(t('profileCreated'),()=>{
      S.profiles=S.profiles.filter(profile=>profile.id!==key);
      renderShell();
    });
  }
}
function toggle(key) {
  const values={lang:['ar','en'],theme:['light','dark'],device:['desktop','mobile']}[key];
  S[key]=S[key]===values[0]?values[1]:values[0];
  applyPrefs();
  if(key==='lang') {
    closeOverlay(false);
    renderShell();
  } else renderDock();
}
function selectLook(key,value) {
  if(S.working.look[S.mode][key]===value) return;
  S.working.look[S.mode][key]=value;
  if(key==='skin' && value==='glass' && S.working.look[S.mode].backdrop==='solid') S.working.look[S.mode].backdrop='mesh';
  renderShell();
  $('[data-look="'+key+'"][data-value="'+value+'"]')?.focus({preventScroll:true});
}
function action(key,id,source) {
  switch(key) {
    case 'theme': case 'lang': case 'device': toggle(key); break;
    case 'dock': $('#dock').hidden=!$('#dock').hidden; break;
    case 'close': closeOverlay(); break;
    case 'retry': setView('loading',true); break;
    case 'restore': {
      setView('ready');
      updateWorking('discarded',work=>{work.look=clone(defaults.look);work.density=defaults.density;});
      break;
    }
    case 'focus': S.focus=!S.focus; renderShell(); break;
    case 'advanced': S.advanced=!S.advanced; renderShell(); $('[data-act="advanced"]')?.focus({preventScroll:true}); break;
    case 'clear': S.query=''; $('#search').value=''; paintResults(); $('#search').focus(); break;
    case 'new-profile': openOverlay('create'); break;
    case 'new-group': openOverlay('group'); break;
    case 'open-item': openOverlay('item',id); break;
    case 'open-profile': openOverlay('profile',Number(id)); break;
    case 'visibility': {
      const item=S.working.nav.find(entry=>entry.id===id);
      updateWorking(item.hidden?'visible':'hidden',work=>{ work.nav.find(entry=>entry.id===id).hidden=!item.hidden; });
      break;
    }
    case 'up': case 'down': moveNav(id,key==='up'?-1:1); break;
    case 'delete-group': updateWorking('groupDeleted',work=>{
      work.groups=work.groups.filter(group=>group.id!==id);
      work.nav.forEach(item=>{ if(item.group===id) item.group=''; });
    }); break;
    case 'save': {
      const previous=clone(S.saved);
      S.saved=clone(S.working); renderShell();
      toast(t('saved'),()=>{ S.saved=previous; renderShell(); });
      break;
    }
    case 'discard': updateWorking('discarded',()=>{ S.working=clone(S.saved); }); break;
    case 'delete-profile': {
      const index=S.profiles.findIndex(profile=>profile.id===Number(id));
      const [profile]=S.profiles.splice(index,1);
      closeOverlay(false); renderShell();
      toast(t('profileDeleted'),()=>{ S.profiles.splice(index,0,profile); S.highlight=profile.id; renderShell(); });
      break;
    }
    case 'apply-profile': {
      const profile=S.profiles.find(entry=>entry.id===Number(id));
      closeOverlay(false); setPage('theme');
      updateWorking('loaded',work=>{ work.look=clone(profile.look); work.density=profile.density; });
      break;
    }
    case 'undo': {
      const record=S.toasts.get(Number(id));
      removeToast(Number(id));
      record?.undo?.();
      toast(t('undone'));
      break;
    }
  }
  if(source?.isConnected && ['theme','device'].includes(key)) $('[data-act="'+key+'"]')?.focus({preventScroll:true});
}
document.addEventListener('click',event=>{
  if(event.target.id==='modal') return closeOverlay();
  const target=event.target.closest('button,[data-act="close"]');
  if(!target||target.disabled) return;
  const d=target.dataset;
  if(d.page) { setPage(d.page); $('[data-page="'+d.page+'"]:not(.area)')?.focus({preventScroll:true}); }
  else if(d.view) setView(d.view);
  else if(d.mode) { S.mode=d.mode; renderShell(); $('[data-mode="'+d.mode+'"]')?.focus({preventScroll:true}); }
  else if(d.look) selectLook(d.look,d.value);
  else if(d.filter) { S.filter=d.filter; paintResults(); $('[data-filter="'+d.filter+'"]')?.focus({preventScroll:true}); }
  else if(d.act) action(d.act,d.id,target);
});
document.addEventListener('input',event=>{
  const input=event.target;
  if(input.id==='search') { S.query=input.value; paintResults(); }
  if(S.overlay?.tried&&input.closest('form')) validate(input.form);
  if(input.dataset.field==='radius') {
    S.working.look[S.mode].radius=Number(input.value);
    $('#radius-value').textContent=number(input.value);
    $('#preview').outerHTML=preview();
    $('#savebar').innerHTML=savebar();
  }
});
document.addEventListener('change',event=>{
  const {field}=event.target.dataset;
  if(field==='density') S.working.density=event.target.value;
  else if(field==='backdrop') S.working.look[S.mode].backdrop=event.target.value;
  else return;
  const select=event.target;
  $('#preview').outerHTML=preview();
  $('#savebar').innerHTML=savebar();
  select.focus({preventScroll:true});
});
document.addEventListener('submit',event=>{ event.preventDefault(); if(S.overlay) handleSubmit(event.target); });
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&S.overlay) { event.preventDefault(); closeOverlay(); return; }
  if(S.overlay) {
    if(event.key==='Tab') {
      const elements=[...overlayEl().querySelectorAll('button:not(:disabled),input,select')];
      if(event.shiftKey&&document.activeElement===elements[0]) { event.preventDefault(); elements.at(-1).focus(); }
      else if(!event.shiftKey&&document.activeElement===elements.at(-1)) { event.preventDefault(); elements[0].focus(); }
    }
    return;
  }
  const focusedTab=event.target.closest('[role=tab]');
  if(focusedTab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
    const pages=['theme','sidebar','profiles'];
    const offset=(event.key==='ArrowRight'?1:-1)*(S.lang==='ar'?-1:1);
    const page=event.key==='Home'?pages[0]:event.key==='End'?pages.at(-1):pages[(pages.indexOf(S.page)+offset+3)%3];
    event.preventDefault(); setPage(page); $('[data-page="'+page+'"]').focus(); return;
  }
  if(event.target.closest('input,select,textarea')||event.ctrlKey||event.altKey||event.metaKey) return;
  const key=event.key.toLowerCase();
  if(/^[1-4]$/.test(key)) setView(['ready','empty','loading','error'][Number(key)-1]);
  if(['t','l','d'].includes(key)) toggle({t:'theme',l:'lang',d:'device'}[key]);
  if(key==='h') $('#dock').hidden=!$('#dock').hidden;
  if(key==='n') openOverlay(S.page==='sidebar'?'group':'create');
  if(key==='/') {
    event.preventDefault();
    if(S.page!=='sidebar'&&S.page!=='profiles') setPage('sidebar');
    $('#search')?.focus();
  }
});
applyPrefs();
renderShell();
</script>
</body>
</html>
